name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    name: Build
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: 2025.7.12
      - uses: SonarSource/ci-github-actions/build-gradle@v1
        with:
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          deploy-pull-request: true
          sonar-platform: next
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '**/build/reports/**/*'
          if-no-files-found: ignore
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/**/*
            **/build/jacoco-coverage.xml
          if-no-files-found: ignore

  promote:
    needs:
      - build
    if: github.event_name != 'pull_request'
    runs-on: github-ubuntu-latest-s
    name: Promote
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          cache_save: false
          version: 2025.7.12
      - uses: SonarSource/ci-github-actions/get-build-number@v1
      - uses: SonarSource/ci-github-actions/promote@v1
        with:
          promote-pull-request: true
          build-name: sonar-compliance-reports
      - name: Publish release information
        if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          module_version="$(sed -n 's/^version=//p' compliance-reports/gradle.properties | head -n1)"
          if [[ -z "${module_version}" ]]; then
            echo "::error title=Missing module version::Unable to determine the module version from compliance-reports/gradle.properties."
            exit 1
          fi

          release_version="$(bash .github/scripts/derive-release-version.sh "${module_version}" "${BUILD_NUMBER}")"

          project_name="${GITHUB_REPOSITORY#*/}"
          release_tag="${release_version}"
          artifactory_build_url="https://repox.jfrog.io/ui/builds/${project_name}/${BUILD_NUMBER}/"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Release Information

          - Commit: \`${GITHUB_SHA}\`
          - Build number: \`${BUILD_NUMBER}\`
          - Release version: \`${release_version}\`
          - Release tag: \`${release_tag}\`
          - Artifactory build: [\`${project_name}:${BUILD_NUMBER}\`](${artifactory_build_url})
          EOF

          echo "::notice title=Release information::build=${BUILD_NUMBER}, version=${release_version}, release_tag=${release_tag}"
