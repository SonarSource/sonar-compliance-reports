name: Release Core

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dryRun:
        required: false
        default: false
        type: boolean

jobs:
  get-release-metadata:
    runs-on: github-ubuntu-latest-s
    outputs:
      version: ${{ steps.determine-metadata.outputs.version }}
    steps:
      - name: Determine release version
        id: determine-metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Reject unsupported private release tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "${VERSION}" == private-* ]]; then
            echo "::error title=Private releases are not supported::Release tag ${VERSION} uses the retired private release path."
            exit 1
          fi

  verify-promoted-build:
    needs: get-release-metadata
    runs-on: github-ubuntu-latest-s
    permissions:
      contents: read
      statuses: read
    outputs:
      tag_sha: ${{ steps.verify.outputs.tag_sha }}
      build_number: ${{ steps.verify.outputs.build_number }}
      promoted_build_url: ${{ steps.verify.outputs.promoted_build_url }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Verify promoted build matches release version
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.get-release-metadata.outputs.version }}
        run: |
          set -euo pipefail

          tag_sha="${GITHUB_SHA}"

          if [[ ! "${VERSION}" =~ [.+-]([0-9]+)$ ]]; then
            echo "::error title=Unsupported version format::Release version ${VERSION} does not end with a build number."
            exit 1
          fi
          expected_build_number="${BASH_REMATCH[1]}"

          IFS=$'\t' read -r promoted_build_url promoted_build_number <<< "$(bash .github/scripts/find-promoted-build-url.sh --format=tsv "${tag_sha}")"

          if [[ -z "${promoted_build_url}" ]]; then
            echo "::error title=Missing promoted build::No successful promoted build status was found for ${tag_sha}. The release ${VERSION} must run on a commit that has already been promoted."
            exit 1
          fi

          if [[ -z "${promoted_build_number}" ]]; then
            echo "::error title=Invalid promoted build URL::Unable to extract the build number from ${promoted_build_url}."
            exit 1
          fi

          if [[ "${promoted_build_number}" != "${expected_build_number}" ]]; then
            echo "::error title=Release/promote mismatch::Version ${VERSION} encodes build ${expected_build_number}, but commit ${tag_sha} is promoted as build ${promoted_build_number} (${promoted_build_url}). Release the version of the promoted build of this commit."
            exit 1
          fi

          echo "tag_sha=${tag_sha}" >> "$GITHUB_OUTPUT"
          echo "build_number=${promoted_build_number}" >> "$GITHUB_OUTPUT"
          echo "promoted_build_url=${promoted_build_url}" >> "$GITHUB_OUTPUT"

  release:
    needs:
      - get-release-metadata
      - verify-promoted-build
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@v7
    with:
      version: ${{ needs.get-release-metadata.outputs.version }}
      dryRun: ${{ inputs.dryRun }}
      mavenCentralSync: true
      publicRelease: true
