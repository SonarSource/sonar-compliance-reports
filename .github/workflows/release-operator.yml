name: Release Operator

run-name: One-click release${{ inputs.commit_sha && format(' @ {0}', inputs.commit_sha) || '' }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Optional promoted default-branch commit SHA to release
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  statuses: read

jobs:
  resolve-target:
    runs-on: github-ubuntu-latest-s
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      promoted_build_url: ${{ steps.resolve.outputs.promoted_build_url }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Resolve promoted release target
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin "${DEFAULT_BRANCH}"
          default_ref="origin/${DEFAULT_BRANCH}"

          promoted_build_metadata_for_sha() {
            local sha="$1"
            bash .github/scripts/find-promoted-build-url.sh --format=tsv "${sha}"
          }

          is_default_branch_commit() {
            local sha="$1"
            git rev-list --first-parent "${default_ref}" | grep -Fxq "${sha}"
          }

          if [[ -n "${INPUT_COMMIT_SHA}" ]]; then
            if ! target_sha="$(git rev-parse --verify "${INPUT_COMMIT_SHA}^{commit}" 2>/dev/null)"; then
              echo "::error title=Unknown commit::Unable to resolve commit ${INPUT_COMMIT_SHA}."
              exit 1
            fi

            if ! is_default_branch_commit "${target_sha}"; then
              echo "::error title=Commit is not on the default branch::Commit ${target_sha} is not part of ${DEFAULT_BRANCH}'s first-parent history."
              exit 1
            fi

            IFS=$'\t' read -r promoted_build_url build_number <<< "$(promoted_build_metadata_for_sha "${target_sha}")"
            if [[ -z "${promoted_build_url}" ]]; then
              echo "::error title=Commit is not promoted::Commit ${target_sha} is on ${DEFAULT_BRANCH}, but it does not have a successful promoted build status."
              exit 1
            fi
          else
            target_sha=""
            promoted_build_url=""
            build_number=""

            while read -r candidate_sha; do
              IFS=$'\t' read -r candidate_url candidate_build_number <<< "$(promoted_build_metadata_for_sha "${candidate_sha}")"
              if [[ -n "${candidate_url}" ]]; then
                target_sha="${candidate_sha}"
                promoted_build_url="${candidate_url}"
                build_number="${candidate_build_number}"
                break
              fi
            done < <(git rev-list --first-parent "${default_ref}")

            if [[ -z "${target_sha}" ]]; then
              echo "::error title=No promoted commit found::Unable to find a successfully promoted commit reachable from ${DEFAULT_BRANCH}."
              exit 1
            fi
          fi

          if [[ -z "${build_number}" ]]; then
            echo "::error title=Invalid promoted build URL::Unable to extract the build number from ${promoted_build_url}."
            exit 1
          fi

          properties_content="$(git show "${target_sha}:compliance-reports/gradle.properties" 2>/dev/null || true)"
          if [[ -z "${properties_content}" ]]; then
            echo "::error title=Missing version file::Unable to read compliance-reports/gradle.properties from ${target_sha}."
            exit 1
          fi

          module_version="$(printf '%s\n' "${properties_content}" | sed -n 's/^version=//p' | head -n1)"
          if [[ -z "${module_version}" ]]; then
            echo "::error title=Unparsable version file::Unable to determine the module version from compliance-reports/gradle.properties at ${target_sha}."
            exit 1
          fi

          release_version="$(bash .github/scripts/derive-release-version.sh "${module_version}" "${build_number}")"
          release_tag="${release_version}"

          {
            echo "target_sha=${target_sha}"
            echo "build_number=${build_number}"
            echo "promoted_build_url=${promoted_build_url}"
            echo "release_version=${release_version}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Resolved release target

          - Commit: \`${target_sha}\`
          - Build number: \`${build_number}\`
          - Release version: \`${release_version}\`
          - Release tag: \`${release_tag}\`
          - Promoted build: ${promoted_build_url}
          EOF

  prepare-release:
    needs: resolve-target
    runs-on: github-ubuntu-latest-s
    outputs:
      action: ${{ steps.prepare.outputs.action }}
      release_id: ${{ steps.prepare.outputs.release_id }}
      status_message: ${{ steps.prepare.outputs.status_message }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Prepare release record
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-target.outputs.release_tag }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
        run: bash .github/scripts/prepare-release-record.sh "${TAG}" "${TARGET_SHA}"

  release:
    if: ${{ needs.prepare-release.outputs.action == 'run' }}
    needs:
      - resolve-target
      - prepare-release
    uses: ./.github/workflows/release-core.yml
    secrets: inherit
    with:
      version: ${{ needs.resolve-target.outputs.release_tag }}
      releaseId: ${{ needs.prepare-release.outputs.release_id }}

  summarize:
    if: ${{ always() }}
    needs:
      - resolve-target
      - prepare-release
      - release
    runs-on: github-ubuntu-latest-s
    steps:
      - name: Summarize release operator outcome
        env:
          PREPARE_ACTION: ${{ needs.prepare-release.outputs.action }}
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          STATUS_MESSAGE: ${{ needs.prepare-release.outputs.status_message }}
          RELEASE_TAG: ${{ needs.resolve-target.outputs.release_tag }}
        run: |
          set -euo pipefail

          {
            echo "## Release operator outcome"
            if [[ -n "${RELEASE_TAG}" ]]; then
              release_message="${STATUS_MESSAGE:-job ${PREPARE_RESULT}}"
              if [[ "${PREPARE_RESULT}" == "success" && "${PREPARE_ACTION}" == "run" ]]; then
                release_message+="; release job: ${RELEASE_RESULT}"
              fi
              echo "- Release \`${RELEASE_TAG}\`: ${release_message}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
