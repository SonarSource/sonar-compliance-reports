name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to process, for example 2.0.0.383 or private-2.0.0.383
        required: true
        type: string
      releaseId:
        description: Existing GitHub release ID to reuse when retrying a kept release
        required: true
        type: string

jobs:
  get-release-metadata:
    runs-on: github-ubuntu-latest-s
    outputs:
      version: ${{ steps.determine-metadata.outputs.version }}
      release_id: ${{ steps.determine-metadata.outputs.release_id }}
      visibility: ${{ steps.determine-visibility.outputs.visibility }}
    steps:
      - name: Determine release version and id
        id: determine-metadata
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.releaseId || github.event.release.id }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
      - name: Determine release visibility
        id: determine-visibility
        run: |
          echo "visibility=${{ startsWith(steps.determine-metadata.outputs.version, 'private-') && 'private' || 'public' }}" >> "$GITHUB_OUTPUT"

  verify-promoted-build:
    needs: get-release-metadata
    runs-on: github-ubuntu-latest-s
    permissions:
      contents: read
      statuses: read
    outputs:
      tag_sha: ${{ steps.verify.outputs.tag_sha }}
      build_number: ${{ steps.verify.outputs.build_number }}
      promoted_build_url: ${{ steps.verify.outputs.promoted_build_url }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Verify promoted build matches release tag
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.get-release-metadata.outputs.version }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          tag_sha="$(git rev-list -n 1 "${VERSION}")"
          if [[ -z "${tag_sha}" ]]; then
            echo "::error title=Tag lookup failed::Unable to resolve commit SHA for tag ${VERSION}."
            exit 1
          fi

          if [[ ! "${VERSION}" =~ [.+-]([0-9]+)$ ]]; then
            echo "::error title=Unsupported tag format::Release tag ${VERSION} does not end with a build number."
            exit 1
          fi
          expected_build_number="${BASH_REMATCH[1]}"

          status_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag_sha}/status")"
          promoted_build_url="$(echo "${status_json}" | jq -r --arg repo "${REPO_NAME}" '
            [
              .statuses[]
              | select(.state == "success")
              | select(.target_url != null)
              | select(.target_url | test("/ui/builds/" + $repo + "/[0-9]+/?$"))
            ][0].target_url // empty
          ')"

          if [[ -z "${promoted_build_url}" ]]; then
            echo "::error title=Missing promoted build::No successful promoted build status was found for ${tag_sha}. The release tag ${VERSION} must point to a commit that has already been promoted."
            exit 1
          fi

          promoted_build_number="$(echo "${promoted_build_url}" | sed -E 's#.*\/ui\/builds\/[^/]+\/([0-9]+)\/?$#\1#')"
          if [[ "${promoted_build_number}" != "${expected_build_number}" ]]; then
            echo "::error title=Release/promote mismatch::Tag ${VERSION} encodes build ${expected_build_number}, but commit ${tag_sha} is promoted as build ${promoted_build_number} (${promoted_build_url}). Retag the promoted build or release the matching promoted commit."
            exit 1
          fi

          echo "tag_sha=${tag_sha}" >> "$GITHUB_OUTPUT"
          echo "build_number=${promoted_build_number}" >> "$GITHUB_OUTPUT"
          echo "promoted_build_url=${promoted_build_url}" >> "$GITHUB_OUTPUT"

  release:
    needs:
      - get-release-metadata
      - verify-promoted-build
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@v6
    with:
      version: ${{ needs.get-release-metadata.outputs.version }}
      releaseId: ${{ needs.get-release-metadata.outputs.release_id }}
      mavenCentralSync: ${{ needs.get-release-metadata.outputs.visibility == 'public' }}
      publicRelease: ${{ needs.get-release-metadata.outputs.visibility == 'public' }}
