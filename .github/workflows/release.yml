name: Release

run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to process, for example 2.0.0.383
        required: true
        type: string
      releaseId:
        description: Existing GitHub release ID to reuse when retrying a kept release
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  statuses: read

jobs:
  release:
    if: ${{ github.event_name != 'release' || !contains(format('{0}', github.event.release.body), '<!-- sonar-compliance-reports:release-origin=operator -->') }}
    uses: ./.github/workflows/release-core.yml
    secrets: inherit
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
      releaseId: ${{ github.event_name == 'workflow_dispatch' && inputs.releaseId || github.event.release.id }}
