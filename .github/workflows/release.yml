name: Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Full version including build number, for example 2.0.0.383
        required: true
        type: string
      dryRun:
        description: Flag to enable the dry-run execution
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  statuses: read

jobs:
  release:
    uses: ./.github/workflows/release-core.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      dryRun: ${{ inputs.dryRun }}
